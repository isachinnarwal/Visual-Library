<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Library</title>
<meta name="description" content="Browsable catalogue of animated HTML visual templates — infographics, timelines, charts and slide layouts.">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="Visual Library">
<meta property="og:description" content="Browsable catalogue of animated HTML visual templates.">
<meta property="og:type" content="website">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<!-- Theme must be resolved before first paint or the neumorphic surfaces flash. -->
<script>
  (function () {
    try {
      var m = localStorage.getItem('vl-mode');
      if (m !== 'light' && m !== 'dark') m = 'dark';
      document.documentElement.setAttribute('data-mode', m);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800;1,900&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>

<body>

<!-- ── Top bar ───────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" aria-label="Visual Library home">
      <span class="brand-mark"><span class="ms filled" aria-hidden="true">school</span></span>
      <span class="brand-name">Visual&nbsp;Library</span>
      <span class="chip chip-outlined brand-ver">v1.0</span>
    </a>

    <span class="topbar-divider" role="separator"></span>

    <nav class="nav-links" aria-label="Library sections">
      <!-- filled by app.js: one quick-jump link per category -->
    </nav>

    <span class="spacer"></span>

    <span class="live-stamp" id="liveStamp" hidden>
      <span class="ms" aria-hidden="true">sync</span>
      <span class="mono" id="liveStampText"></span>
    </span>

    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme" data-tip="Switch theme">
      <span class="ms" aria-hidden="true">light_mode</span>
    </button>
  </div>
</header>

<!-- ── Page ──────────────────────────────────────────────────────────────── -->
<main class="page">

  <div class="page-head">
    <div>
      <h1 class="display-title">Visual Library</h1>
      <p class="caption" id="countLine">—</p>
    </div>

    <span class="spacer"></span>

    <div class="head-actions">
      <button class="btn btn-text" id="expandAll" type="button">
        <span class="ms" aria-hidden="true">unfold_more</span> Expand all
      </button>
      <button class="btn btn-text" id="collapseAll" type="button">
        <span class="ms" aria-hidden="true">unfold_less</span> Collapse all
      </button>

      <div class="field">
        <span class="ms field-icon" aria-hidden="true">search</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search ID, name, tag…" aria-label="Search templates">
        <button class="icon-btn field-clear" id="searchClear" type="button" hidden aria-label="Clear search">
          <span class="ms" aria-hidden="true">close</span>
        </button>
      </div>
    </div>
  </div>

  <div id="activeTagRow" class="tag-row" hidden>
    <button class="chip chip-primary chip-deletable" id="activeTagChip" type="button">
      <span id="activeTagLabel"></span>
      <span class="ms" aria-hidden="true">cancel</span>
    </button>
  </div>

  <!-- Loading skeletons -->
  <div id="skeletons" class="sections">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <!-- Empty state -->
  <div id="emptyState" class="empty" hidden>
    <span class="ms empty-icon" aria-hidden="true">search_off</span>
    <p class="empty-title">No matching templates</p>
    <p class="caption">Try clearing filters.</p>
  </div>

  <!-- Category sections -->
  <div id="sections" class="sections"></div>

</main>

<!-- ── Fullscreen preview dialog ─────────────────────────────────────────── -->
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="Template preview" hidden>
  <div class="dialog-bar">
    <button class="btn btn-outlined" id="dlgClose" type="button">
      <span class="ms" aria-hidden="true">arrow_back</span> Library
    </button>

    <div class="dlg-title">
      <span class="mono dlg-id" id="dlgId"></span>
      <span class="dlg-name" id="dlgName"></span>
    </div>

    <span class="spacer"></span>

    <div class="toggle-group" role="group" aria-label="Preview mode">
      <button class="toggle" data-mode="animated" type="button" aria-pressed="true" title="Play the animation">
        <span class="ms" aria-hidden="true">play_circle</span><span class="toggle-label">Animated</span>
      </button>
      <button class="toggle" data-mode="snapshot" type="button" aria-pressed="false" title="Jump to the final frame">
        <span class="ms" aria-hidden="true">movie_filter</span><span class="toggle-label">Final frame</span>
      </button>
      <button class="toggle" data-mode="still" type="button" aria-pressed="false" title="Show the still preview.png">
        <span class="ms" aria-hidden="true">image</span><span class="toggle-label">preview.png</span>
      </button>
    </div>

    <button class="btn btn-contained" id="dlgCopy" type="button">
      <span class="ms" aria-hidden="true">content_copy</span> <span id="dlgCopyLabel">Copy</span>
    </button>
  </div>

  <div class="dialog-body">
    <div class="stage" id="dlgStage">
      <!-- iframe / img injected by app.js -->
    </div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────────────────────────────── -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span class="ms toast-icon" aria-hidden="true">check_circle</span>
  <span id="toastMsg"></span>
  <button class="icon-btn toast-close" id="toastClose" type="button" aria-label="Dismiss">
    <span class="ms" aria-hidden="true">close</span>
  </button>
</div>

<script src="assets/app.js"></script>
</body>
</html>
