<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INF-2P-012 — Diagonal-cut gradient pills with dashed relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,300,0,0&display=swap" rel="stylesheet">
<style>
  /* === BRAND TOKENS — overridden at use-time per pipeline ============ */
  .canvas {
    --bg:        #CED4E1;   /* cool slate field                          */
    --slash:     #F0F1F2;   /* the diagonal light stripe                 */
    --disc:      #FFFFFF;   /* badge discs                               */
    --on-color:  #FFFFFF;   /* copy sitting on a pill                    */

    /* each pill is a vertical gradient; the relay runs c1 → c2 */
    --c1-top:    #E2372A;   /* pill 1 — red                              */
    --c1-mid:    #DD372A;
    --c1-bot:    #A52A20;
    --c2-top:    #F8963A;   /* pill 2 — orange                           */
    --c2-mid:    #F7973A;
    --c2-bot:    #A5652A;

    --font-display:'Poppins', sans-serif;
    --font-body:   'Poppins', sans-serif;
  }

  /* === RESET ======================================================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* === CANVAS — 1920x1080 ===========================================
       ONE diagonal governs the whole layout:  x = 1293 − 0.625y
       Pill 1's right end and pill 2's left end are both cut along it,
       the light slash sits on it, and both badges are centred on it.
       Pill 1 y 226→474 · pill 2 y 608→856 · both 248 tall, r 124.     */
  .canvas {
    position: relative;
    width: 1920px; height: 1080px;
    background: var(--bg);
    font-family: var(--font-body);
    overflow: hidden;
  }

  .layer { position: absolute; inset: 0; }
  .layer-art  { z-index: 1; }
  .layer-copy { z-index: 2; }

  /* === PILL COPY — mirrored, each hugging its pill's blunt end ======= */
  .pill-copy {
    position: absolute;
    width: 510px; height: 216px;
    display: flex; flex-direction: column; justify-content: center;
    color: var(--on-color);
    z-index: 2;
  }
  .pill-copy-1 { left: 470px; top: 242px; text-align: right; }
  .pill-copy-2 { left: 940px; top: 624px; text-align: left;  }

  .pill-label {
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .pill-body {
    font-weight: 300;
    font-size: 28px;
    line-height: 1.5;
    opacity: 0.93;
  }

  /* === BADGE ICONS — centred on the diagonal, over the pill seam ===== */
  .badge-icon {
    position: absolute;
    width: 76px; height: 76px;
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
  }
  .badge-icon-1 { left: 1036px; top: 314px; color: var(--c1-top); }
  .badge-icon-2 { left: 808px;  top: 678px; color: var(--c2-top); }
  .badge-icon .material-symbols-outlined {
    font-size: 76px;
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
  }
</style>
</head>
<body>

<div class="canvas" data-library-id="INF-2P-012"
     data-width="1920" data-height="1080" data-duration="6">

  <svg class="layer layer-art" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
      <linearGradient id="p12-g1" x1="0" y1="226" x2="0" y2="474" gradientUnits="userSpaceOnUse">
        <stop offset="0"    stop-color="var(--c1-top)"/>
        <stop offset="0.45" stop-color="var(--c1-mid)"/>
        <stop offset="1"    stop-color="var(--c1-bot)"/>
      </linearGradient>
      <linearGradient id="p12-g2" x1="0" y1="608" x2="0" y2="856" gradientUnits="userSpaceOnUse">
        <stop offset="0"    stop-color="var(--c2-top)"/>
        <stop offset="0.45" stop-color="var(--c2-mid)"/>
        <stop offset="1"    stop-color="var(--c2-bot)"/>
      </linearGradient>
      <linearGradient id="p12-grelay" x1="1414" y1="352" x2="580" y2="716" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--c1-top)"/>
        <stop offset="1" stop-color="var(--c2-top)"/>
      </linearGradient>
      <filter id="p12-shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5B6478" flood-opacity="0.35"/>
      </filter>
      <filter id="p12-shadow-sm" x="-40%" y="-40%" width="180%" height="200%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5B6478" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- the light slash: the diagonal every other edge is measured from -->
    <line class="slash" x1="1210" y1="133" x2="713" y2="928"
          stroke="var(--slash)" stroke-width="11" stroke-linecap="round" pathLength="1"/>

    <!-- pill 1 — stadium on the left, cut by the diagonal on the right -->
    <path class="pill pill-1" fill="url(#p12-g1)" filter="url(#p12-shadow)"
          d="M 489 226 L 1152 226 L 997 474 L 489 474 A 124 124 0 0 1 489 226 Z"/>

    <!-- pill 2 — cut by the diagonal on the left, stadium on the right -->
    <path class="pill pill-2" fill="url(#p12-g2)" filter="url(#p12-shadow)"
          d="M 913 608 L 1429 608 A 124 124 0 0 1 1429 856 L 758 856 Z"/>

    <!-- dashed relay, badge 1 → badge 2 -->
    <path class="relay" fill="none" stroke="url(#p12-grelay)" stroke-width="7"
          stroke-dasharray="25 14" stroke-linecap="butt"
          d="M 1187 352 H 1364 A 50 50 0 0 1 1414 402 V 484 A 50 50 0 0 1 1364 534
             H 630 A 50 50 0 0 0 580 584 V 666 A 50 50 0 0 0 630 716 H 771"/>

    <circle class="badge badge-1" cx="1074" cy="352" r="72" fill="var(--disc)" filter="url(#p12-shadow-sm)"/>
    <circle class="badge badge-2" cx="846"  cy="716" r="72" fill="var(--disc)" filter="url(#p12-shadow-sm)"/>
  </svg>

  <div class="pill-copy pill-copy-1">
    <h3 class="pill-label" data-token="p1.label">Projects 01</h3>
    <p  class="pill-body"  data-token="p1.body">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sedri adiam esad nonummy nibh euismod.</p>
  </div>
  <div class="pill-copy pill-copy-2">
    <h3 class="pill-label" data-token="p2.label">Projects 02</h3>
    <p  class="pill-body"  data-token="p2.body">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sedri adiam esad nonummy nibh euismod.</p>
  </div>

  <div class="badge-icon badge-icon-1"><span class="material-symbols-outlined" data-token="p1.icon">insights</span></div>
  <div class="badge-icon badge-icon-2"><span class="material-symbols-outlined" data-token="p2.icon">assignment</span></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // === GSAP TIMELINE — slash draws, then pill 1 relays into pill 2 ====
  // 0.20 slash draws down the diagonal
  // 0.90 pill 1 slides in from the left → badge → label → body
  // 2.20 relay draws badge 1 → badge 2
  // 3.10 pill 2 slides in from the right → badge → label → body
  // ends ~4.4 → hold to 6.0

  gsap.set('.slash',        {strokeDasharray: 1, strokeDashoffset: 1});
  gsap.set('.pill-1',       {opacity: 0, x: -90});
  gsap.set('.pill-2',       {opacity: 0, x: 90});
  gsap.set('.relay',        {strokeDashoffset: 0, opacity: 0});
  gsap.set('.badge-1',      {opacity: 0, scale: 0.4, svgOrigin: '1074 352'});
  gsap.set('.badge-2',      {opacity: 0, scale: 0.4, svgOrigin: '846 716'});
  gsap.set('.badge-icon',   {opacity: 0, scale: 0.5, transformOrigin: 'center'});
  gsap.set('.pill-label',   {opacity: 0, y: 14});
  gsap.set('.pill-body',    {opacity: 0, y: 14});

  const tl = gsap.timeline({paused: true});

  tl.to('.slash', {strokeDashoffset: 0, duration: 0.80, ease: 'power2.inOut'}, 0.20);

  function revealPill(n, t, dir) {
    tl.to('.pill-'       + n, {opacity: 1, x: 0, duration: 0.60, ease: 'power3.out'},         t)
      .to('.badge-'      + n, {opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)'},  t + 0.35)
      .to('.badge-icon-' + n, {opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out'},     t + 0.52)
      .to('.pill-copy-'  + n + ' .pill-label', {opacity: 1, y: 0, duration: 0.40, ease: 'power2.out'}, t + 0.45)
      .to('.pill-copy-'  + n + ' .pill-body',  {opacity: 1, y: 0, duration: 0.45, ease: 'power2.out'}, t + 0.60);
  }

  revealPill(1, 0.90);
  // the relay carries its own dash pattern, so it cannot also draw via
  // stroke-dashoffset — it fades in as a whole instead
  tl.to('.relay', {opacity: 1, duration: 0.60, ease: 'power1.out'}, 2.20);
  revealPill(2, 3.10);

  tl.to({}, {duration: 1.2}, 4.8);

  window.__libraryTimeline = tl;

  // === RUNTIME MODES ==================================================
  // ?snapshot=1  →  preview.sh thumbnail: fast-forward to the final frame
  // __hfSeek     →  HyperFrames pipeline drives the timeline via seek
  // otherwise    →  standalone preview / Launch panel: auto-play
  const __SNAPSHOT = new URLSearchParams(window.location.search).has('snapshot');
  if (__SNAPSHOT) {
    document.fonts.ready.then(() => {
      tl.progress(1);
      requestAnimationFrame(() =>
        document.documentElement.setAttribute('data-snapshot-ready', '1'));
    });
  } else if (typeof window.__hfSeek === 'undefined') {
    tl.play();
  }
</script>

</body>
</html>
