<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>INF-6P-002 — Lightbulb center + 6-wedge top arch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,1,0&display=swap" rel="stylesheet">
<style>
  /* === BRAND TOKENS ================================================= */
  .canvas {
    --bg-deep: #E8EDF0;
    --text-light: #FFFFFF;
    --color-1: #3FB8D9;     /* far-LEFT cyan */
    --color-2: #2D7BBD;
    --color-3: #1F3F65;
    --color-4: #7A1F1F;
    --color-5: #D03434;
    --color-6: #E8852A;     /* far-RIGHT orange */
    --bulb-yellow: #FACC2E;
    --bulb-glow:   #FFE066;
    --bulb-flame:  #F26430;
    --separator:   #FFFFFF;
    --font-body:   'Source Sans Pro', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  .canvas {
    position: relative;
    width: 1920px; height: 1080px;
    background: var(--bg-deep);
    font-family: var(--font-body);
    overflow: hidden;
  }

  /* === ARCH SVG ====================================================
       Center (960, 720). Inner R 240. Outer R 560. Wedge thickness 320.
       6 wedges × 30° spanning -180° to 0°.
       White separator strokes 6px between wedges.                    */
  .arch-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .wedge {
    stroke: var(--separator);
    stroke-width: 6;
    stroke-linejoin: round;
    filter: drop-shadow(0 8px 16px rgba(20, 20, 30, 0.18));
  }
  .wedge.w-1 { fill: var(--color-1); }
  .wedge.w-2 { fill: var(--color-2); }
  .wedge.w-3 { fill: var(--color-3); }
  .wedge.w-4 { fill: var(--color-4); }
  .wedge.w-5 { fill: var(--color-5); }
  .wedge.w-6 { fill: var(--color-6); }

  /* === WEDGE LABEL BOXES ===========================================
       180×170 boxes centered at mid-radius 400, mid-angle of each wedge.
       Padding 16px vertical / 14px horizontal for breathing room.    */
  .wedge-label {
    position: absolute;
    width: 180px;
    height: 170px;
    padding: 16px 14px;
    transform: translate(-50%, -50%);
    color: var(--text-light);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    z-index: 4;
  }
  .wedge-label .wn {
    font-weight: 900;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .wedge-label .wl {
    font-weight: 700;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
    white-space: nowrap;
  }
  .wedge-label .wb {
    font-weight: 400;
    font-size: 28px;
    line-height: 1.15;
    opacity: 0.96;
  }

  /* Label positions: mid-radius 400 from (960, 720) at each mid-angle */
  .wedge-label.l-1 { left: 574px;  top: 616px; }   /* -165° */
  .wedge-label.l-2 { left: 677px;  top: 437px; }   /* -135° */
  .wedge-label.l-3 { left: 856px;  top: 334px; }   /* -105° */
  .wedge-label.l-4 { left: 1064px; top: 334px; }   /*  -75° */
  .wedge-label.l-5 { left: 1243px; top: 437px; }   /*  -45° */
  .wedge-label.l-6 { left: 1346px; top: 616px; }   /*  -15° */

  /* === LIGHTBULB — large, centered, peeks UP into arch's inner space
       Bulb center (960, 800). Bulb size 300. Flame below.           */
  .bulb-wrap {
    position: absolute;
    left: 50%; top: 720px;
    transform: translateX(-50%);
    width: 320px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bulb-glow {
    position: absolute;
    width: 460px; height: 460px;
    top: -260px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--bulb-glow) 0%, transparent 60%);
    opacity: 0.65;
    pointer-events: none;
  }
  .bulb {
    position: relative;
    width: 300px; height: 300px;
    margin-top: -200px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 16px 32px rgba(20, 20, 30, 0.28));
  }
  .bulb .material-symbols-outlined {
    font-size: 300px;
    color: var(--bulb-yellow);
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;
  }
  .bulb-flame {
    width: 80px;
    height: 130px;
    margin-top: -16px;
    background: linear-gradient(180deg, var(--bulb-flame) 0%, var(--bulb-yellow) 85%);
    border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
    box-shadow: 0 16px 36px rgba(242, 100, 48, 0.65);
  }
</style>
</head>
<body>

<div class="canvas" data-library-id="INF-6P-002"
     data-width="1920" data-height="1080" data-duration="7">

  <!-- ============ ARCH (6 donut wedges) =============================
       Center (960,720), inner R=240, outer R=560.
       Each wedge 30° from -180° (left) to 0° (right).                -->
  <svg class="arch-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <path class="wedge w-1" d="M 720 720 L 400 720 A 560 560 0 0 1 475 440 L 752 600 A 240 240 0 0 0 720 720 Z" />
    <path class="wedge w-2" d="M 752 600 L 475 440 A 560 560 0 0 1 680 235 L 840 512 A 240 240 0 0 0 752 600 Z" />
    <path class="wedge w-3" d="M 840 512 L 680 235 A 560 560 0 0 1 960 160 L 960 480 A 240 240 0 0 0 840 512 Z" />
    <path class="wedge w-4" d="M 960 480 L 960 160 A 560 560 0 0 1 1240 235 L 1080 512 A 240 240 0 0 0 960 480 Z" />
    <path class="wedge w-5" d="M 1080 512 L 1240 235 A 560 560 0 0 1 1445 440 L 1168 600 A 240 240 0 0 0 1080 512 Z" />
    <path class="wedge w-6" d="M 1168 600 L 1445 440 A 560 560 0 0 1 1520 720 L 1200 720 A 240 240 0 0 0 1168 600 Z" />
  </svg>

  <!-- ============ WEDGE LABELS — properly centered, padded =========
       Each label box is 180×170 with 16px/14px padding. Vertical centering
       via flex. Number (40px), label (28px UPPER), body (28px) — total
       content fits comfortably with breathing room above/below.       -->
  <div class="wedge-label l-1">
    <span class="wn" data-token="s1.num">01</span>
    <span class="wl" data-token="s1.label">Sample</span>
    <span class="wb" data-token="s1.body">Short caption text here.</span>
  </div>
  <div class="wedge-label l-2">
    <span class="wn" data-token="s2.num">02</span>
    <span class="wl" data-token="s2.label">Sample</span>
    <span class="wb" data-token="s2.body">Short caption text here.</span>
  </div>
  <div class="wedge-label l-3">
    <span class="wn" data-token="s3.num">03</span>
    <span class="wl" data-token="s3.label">Sample</span>
    <span class="wb" data-token="s3.body">Short caption text here.</span>
  </div>
  <div class="wedge-label l-4">
    <span class="wn" data-token="s4.num">04</span>
    <span class="wl" data-token="s4.label">Sample</span>
    <span class="wb" data-token="s4.body">Short caption text here.</span>
  </div>
  <div class="wedge-label l-5">
    <span class="wn" data-token="s5.num">05</span>
    <span class="wl" data-token="s5.label">Sample</span>
    <span class="wb" data-token="s5.body">Short caption text here.</span>
  </div>
  <div class="wedge-label l-6">
    <span class="wn" data-token="s6.num">06</span>
    <span class="wl" data-token="s6.label">Sample</span>
    <span class="wb" data-token="s6.body">Short caption text here.</span>
  </div>

  <!-- ============ LIGHTBULB — large, centered =====================
       Bulb peeks UP into the arch's inner empty area; flame below.   -->
  <div class="bulb-wrap">
    <div class="bulb-glow"></div>
    <div class="bulb"><span class="material-symbols-outlined">lightbulb</span></div>
    <div class="bulb-flame"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // === GSAP TIMELINE — bulb → wedges 1-6 sweep =======================
  // 0.0  Blank
  // 0.2  Lightbulb rises in from below
  // 0.7  Glow blooms
  // 0.9  Flame ignites
  // 1.3  Wedge 1 + label reveal
  // 1.8  Wedge 2
  // 2.3  Wedge 3
  // 2.8  Wedge 4
  // 3.3  Wedge 5
  // 3.8  Wedge 6  (ends ~4.6)
  // 5.5  Hold to 7.0

  gsap.set('.bulb',       {opacity: 0, y: 80, scale: 0.6, transformOrigin: 'center bottom'});
  gsap.set('.bulb-glow',  {opacity: 0, scale: 0.3, transformOrigin: 'center'});
  gsap.set('.bulb-flame', {opacity: 0, scaleY: 0.2, transformOrigin: 'center top'});
  gsap.set('.wedge',      {opacity: 0, transformOrigin: '960px 720px'});
  gsap.set('.wedge-label',{opacity: 0, y: 12});

  const tl = gsap.timeline({paused: true});

  tl.to('.bulb',       {opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.4)'}, 0.2);
  tl.to('.bulb-glow',  {opacity: 0.65, scale: 1, duration: 0.7, ease: 'power2.out'}, 0.55);
  tl.to('.bulb-flame', {opacity: 1, scaleY: 1, duration: 0.4, ease: 'back.out(1.6)'}, 0.85);

  function revealWedge(n, startTime) {
    tl.fromTo('.w-' + n,
      {opacity: 0, scale: 0.85},
      {opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.4)'},
      startTime);
    tl.to('.l-' + n,
      {opacity: 1, y: 0, duration: 0.40, ease: 'power2.out'},
      startTime + 0.25);
  }

  revealWedge(1, 1.3);
  revealWedge(2, 1.8);
  revealWedge(3, 2.3);
  revealWedge(4, 2.8);
  revealWedge(5, 3.3);
  revealWedge(6, 3.8);

  tl.to({}, {duration: 1.5}, 5.5);

  window.__libraryTimeline = tl;

  const __SNAPSHOT = new URLSearchParams(window.location.search).has('snapshot');
  if (__SNAPSHOT) {
    document.fonts.ready.then(() => {
      tl.progress(1);
      requestAnimationFrame(() =>
        document.documentElement.setAttribute('data-snapshot-ready', '1'));
    });
  } else if (typeof window.__hfSeek === 'undefined') {
    tl.play();
  }
</script>

</body>
</html>
